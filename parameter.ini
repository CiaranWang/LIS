# LIS parameter file
#
# Lines beginning with # are comments.
# Long list parameters can be written across multiple lines. Continuation
# lines are attached to the most recent key.

[motivation]

# Motivation-rate matrix.
# Rows are motivations being updated: eat, rest, walk.
# Columns are behaviours performed in the current step: eat, rest, walk.
# Values may be decimals or simple fractions.
motivation_rate =
    -5/9,  1/15,  2/45
       0,  -5/9,  5/24
       0,   5/9, -5/24

[pen]

# Pen length and width in cm.
lx = 450
ly = 350

[movement]

# Number of movement directions.
# Must be at least 4 and divisible by 4.
n_theta = 8

# Distance an animal moves per simulation step, in cm.
step_size = 40

# Distance within which animals can sense each other, in cm.
sensing_range = 40

# Gaussian blur sigma used in density/orientation calculations.
sigma_blur = 60

[animals]

# Animal body diameter in cm.
body_size = 40

[interactions]

# Standard deviation for observed bite force.
bite_force_sigma_e = 1

# Distribution used to transform bite force trait value to observation.
# Supported values: Gaussian, normal, Poisson+1, lognormal, uniform.
# Names are case-insensitive.
bite_force_dist = lognormal

[feeders]

# Number of feeders.
n_feeder = 1

# Feeder coordinates as x,y pairs in cm.
# Provide exactly one row per feeder.
# Each feeder must satisfy: 0 <= x <= lx and 0 <= y <= ly.
feeder_coordinates =
    225, 175
